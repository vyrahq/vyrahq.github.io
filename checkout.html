<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #fff;
    }

    .wrap {
      max-width: 1050px;
      margin: 40px auto;
      padding: 20px;
    }

    .back-link {
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 20px;
    }

    .checkout-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .card {
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 16px;
      padding: 22px;
      background: rgba(255,255,255,.03);
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
    }

    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid #ccc;
      font: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 11px 0;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }

    .total {
      margin-top: 18px;
      font-size: 22px;
      font-weight: 800;
    }

    .payment-contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 22px;
    }

    .sub-card {
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 14px;
      padding: 18px;
      background: rgba(255,255,255,.03);
    }

    .qr-image {
      width: 230px;
      max-width: 100%;
      height: auto;
      display: block;
      margin: 14px auto;
      border-radius: 12px;
    }

    .contact-button {
      display: inline-block;
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 10px;
      background: #fff;
      color: #111;
      text-decoration: none;
      font-weight: 800;
    }

    .confirm-btn {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .note {
      opacity: .75;
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 800px) {
      .checkout-grid,
      .payment-contact-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <a href="products.html" class="back-link">← Back to Cart</a>

    <div class="checkout-grid">

      <section class="card">
        <h2>Customer Details</h2>

        <div class="field">
          <label for="customer-name">Full Name</label>
          <input id="customer-name" type="text" placeholder="Your name">
        </div>

        <div class="field">
          <label for="customer-phone">Phone Number</label>
          <input id="customer-phone" type="tel" placeholder="01X-XXXXXXX">
        </div>

        <div class="field">
          <label for="customer-address">Delivery Address</label>
          <textarea id="customer-address" placeholder="Full delivery address"></textarea>
        </div>

        <div class="field">
          <label for="customer-note">Order Note (optional)</label>
          <textarea id="customer-note" placeholder="Any note for this order"></textarea>
        </div>
      </section>

      <section class="card">
        <h2>Order Summary</h2>

        <div id="checkout-items"></div>

        <div class="total">
          Total: RM<span id="checkout-total">0.00</span>
        </div>

        <div class="payment-contact-grid">

          <div class="sub-card">

  <script>
    // Works with either cart key so it is easier to reuse with your existing generic shop template.
    const cart =
      JSON.parse(localStorage.getItem('shopCart')) ||
      JSON.parse(localStorage.getItem('vyraCart')) ||
      [];

    function renderCheckout() {
      const box = document.getElementById('checkout-items');
      const totalBox = document.getElementById('checkout-total');

      if (cart.length === 0) {
        box.innerHTML = '<p>Your cart is empty.</p>';
        totalBox.textContent = '0.00';
        return;
      }

      let total = 0;
      let html = '';

      cart.forEach(item => {
        const price = Number(item.price) || 0;
        const qty = Number(item.qty) || 0;
        const subtotal = price * qty;
        total += subtotal;

        html += `
          <div class="summary-item">
            <div>
              <strong>${item.name}</strong><br>
              RM${price.toFixed(2)} × ${qty}
            </div>
            <div>RM${subtotal.toFixed(2)}</div>
          </div>
        `;
      });

      box.innerHTML = html;
      totalBox.textContent = total.toFixed(2);
    }

    function confirmOrder() {
      const name = document.getElementById('customer-name').value.trim();
      const phone = document.getElementById('customer-phone').value.trim();
      const address = document.getElementById('customer-address').value.trim();
      const note = document.getElementById('customer-note').value.trim();

      if (cart.length === 0) {
        alert('Cart masih kosong.');
        return;
      }

      if (!name || !phone || !address) {
        alert('Sila isi nama, nombor telefon dan alamat.');
        return;
      }

      let total = 0;
      let orderText = '';

      cart.forEach(item => {
        const price = Number(item.price) || 0;
        const qty = Number(item.qty) || 0;
        const subtotal = price * qty;
        total += subtotal;
        orderText += `${item.name} x${qty} - RM${subtotal.toFixed(2)}\n`;
      });

      const message =
`NEW ORDER

Name: ${name}
Phone: ${phone}
Address: ${address}

Order:
${orderText}
Total: RM${total.toFixed(2)}

Note: ${note || '-'}

Payment has been made. I will attach the payment receipt in this chat.`;

      const whatsappNumber = '60174676980';
      const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;

      window.open(url, '_blank');
    }

    renderCheckout();
  </script>
