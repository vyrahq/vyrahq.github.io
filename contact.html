<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact VYRA</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .contact-wrap {
      max-width: 900px;
      margin: 80px auto;
      padding: 30px;
    }

    .contact-wrap h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .contact-wrap p {
      font-size: 18px;
      line-height: 1.7;
      color: #d1d5db;
    }

    .contact-box {
      margin-top: 30px;
      padding: 25px;
      border: 1px solid #374151;
      border-radius: 12px;
    }

    .contact-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 14px 22px;
      background: white;
      color: #111827;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .back-btn {
      display: inline-block;
      margin-top: 30px;
      margin-left: 10px;
      color: white;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="contact-wrap">
    <h1>Contact Us</h1>

    <p>
      Need help with your order? Contact us directly through WhatsApp.
    </p>

    <div class="contact-box">
      <h2>WhatsApp</h2>
      <p>+60 10-225 4382</p>

      <a
        href="https://wa.me/60102254382"
        class="contact-btn"
        target="_blank"
        rel="noopener"
      >
        Chat on WhatsApp
      </a>
    </div>

    <a href="index.html" class="back-btn">Back to Home</a>
  </div>

</body>
</html>
